[preset.0]

name="LayoutSmoke"
platform="Windows Desktop"
runnable=false
custom_features="blocky_export"
export_filter="all_resources"
include_filter="resources/level_layouts/*.json,resources/level_catalogs/*.json,resources/loot/*.json,resources/scanner/*.json,resources/level_scenery.json"
exclude_filter="assets/library/*,build/*,docs/*"
export_path="build/level_designer_smoke.pck"
script_export_mode=2

[preset.0.options]

binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
